version: '3.8'

services:
  heartcare:
    build: .
    container_name: heartcare-pro
    ports:
      - "8501:8501"
    volumes:
      # Persist database and models
      - ./models:/app/models
      - ./database:/app/database
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - heartcare-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  heartcare-network:
    driver: bridge
